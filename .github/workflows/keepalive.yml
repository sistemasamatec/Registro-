name: Manter o Supabase activo
on:
  schedule:
    - cron: "17 6 * * *"   # todos os dias, 06:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chamar a base de dados
        run: |
          URL=$(sed -n 's/.*url: *"\([^"]*\)".*/\1/p' site/config.js)
          KEY=$(sed -n 's/.*anonKey: *"\([^"]*\)".*/\1/p' site/config.js)
          test -n "$URL" && test -n "$KEY"
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
